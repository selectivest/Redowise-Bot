image: python:3.11-slim

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - pip install -r requirements.txt

test:
  stage: test
  script:
    - python -m pytest

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t taskmanager-bot .
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - scp docker-compose.yml $SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/
    - ssh $SERVER_USER@$SERVER_HOST "cd $DEPLOY_PATH && docker-compose pull && docker-compose up -d"
  only:
    - main 